<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{SITE_TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="{{LOGO_SVG}}">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;800&display=swap');
    
    :root {
      --bg-body: #090d16;
      --bg-card: #111827;
      --bg-hover: #1f2937;
      --text-main: #f9fafb;
      --text-sec: #9ca3af;
      --border: #1f2937;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-body: #f8fafc;
        --bg-card: #ffffff;
        --bg-hover: #f1f5f9;
        --text-main: #0f172a;
        --text-sec: #64748b;
        --border: #e2e8f0;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --danger: #dc2626;
      }
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); min-height: 100dvh; display: flex; flex-direction: column; }
    .bg-grid { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 24px 24px; mask-image: linear-gradient(to bottom, white 15%, transparent 85%); -webkit-mask-image: linear-gradient(to bottom, white 15%, transparent 85%); }
    .ui-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
    .ui-input { background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; outline: none; }
    .ui-input:focus { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #fff; font-weight: 600; border-radius: 8px; transition: background 0.15s; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
    .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); font-weight: 600; border-radius: 8px; }
    .btn-secondary:hover { background: var(--bg-hover); }
    .letter-spacing-code { letter-spacing: 0.4em; padding-left: 0.4em; font-family: 'JetBrains Mono', monospace; font-weight: 800; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <!-- 页头 -->
  <header class="w-full flex items-center justify-between px-6 py-4 border-b border-[var(--border)] bg-[var(--bg-body)]/80 backdrop-blur-md">
     <div class="flex items-center gap-3">
       <div class="w-8 h-8 bg-[var(--accent)] rounded-lg flex items-center justify-center text-white shrink-0 shadow-sm">
         <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
       </div>
       <span class="text-base font-bold" id="site-title-text"></span>
     </div>
     <nav id="main-nav" class="text-xs font-semibold text-[var(--text-sec)]"></nav>
  </header>

  <!-- 主内容区 -->
  <main id="main-content" class="w-full flex-1 flex flex-col items-center p-4 md:p-12 z-10"></main>

  <!-- 轻提示 Toast -->
  <div id="toast" class="fixed bottom-8 z-[100] px-4 py-2 rounded-lg bg-white text-black dark:bg-slate-800 dark:text-white text-xs font-medium shadow-xl transform translate-y-8 opacity-0 transition-all duration-300 pointer-events-none">
     <span id="toast-msg"></span>
  </div>

  <script>
    /* 配置数据 */
    const siteConfig = {
      title: "{{SITE_TITLE}}",
      mode: "{{MODE}}", 
      serverCfg: {{CFG_JSON}},
      api: {
        find: '/api/find',
        presignGet: '/api/presign-get',
        presignPut: '/api/presign-put',
        burn: '/api/burn',
        newCode: '/api/new-code',
        adminList: '/api/admin-list',
        delete: '/api/delete',
        direct: '/api/direct'
      }
    };

    const State = { selectedFiles: [], downloadList: [], uploadMode: 'file', uploadTarget: 'burn', isUploading: false };
    const $ = id => document.getElementById(id);

    function escapeHtml(str) {
      return str ? String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function copyText(str) {
      if (!str) return;
      navigator.clipboard.writeText(str);
      showToast("复制成功");
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = $('toast');
      $('toast-msg').innerText = msg;
      el.classList.remove('opacity-0', 'translate-y-8');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('opacity-0', 'translate-y-8'), 2500);
    }

    /* 初始化 */
    function initApp() {
      $('site-title-text').innerText = siteConfig.title;
      const nav = $('main-nav'), main = $('main-content');
      
      if (siteConfig.mode === 'front') {
        nav.innerText = siteConfig.serverCfg.navCodeDownload || "验证提取";
        main.innerHTML = `
        <div class="w-full max-w-md mt-6 flex flex-col items-center">
           <div id="view-input" class="w-full flex flex-col items-center">
              <h1 class="text-2xl font-bold mb-1">验证提取</h1>
              <p class="text-[var(--text-sec)] text-xs mb-6">输入 4 位提取码，提取后数据立即销毁。</p>
              <div class="w-full flex flex-col gap-3">
                <input type="text" id="input-code" maxlength="4" placeholder="••••" autocomplete="off" class="ui-input w-full text-center text-4xl letter-spacing-code py-3 uppercase">
                <button onclick="handleFindFiles()" id="btn-fetch" class="btn-primary w-full py-3 text-sm">提取数据</button>
              </div>
           </div>

           <div id="view-result" class="hidden w-full flex-col">
              <div class="flex justify-between items-center mb-3">
                 <h2 class="text-sm font-bold">待提取清单</h2>
                 <span class="text-xs font-mono text-[var(--text-sec)]" id="text-dl-count"></span>
              </div>
              <div class="ui-card w-full overflow-hidden">
                 <div id="dl-item-list" class="divide-y divide-[var(--border)] max-h-[40vh] overflow-y-auto"></div>
                 <div class="p-3 bg-[var(--bg-hover)] border-t border-[var(--border)]">
                     <div id="box-dl-progress" class="hidden items-center gap-2 mb-2">
                        <span id="text-dl-filename" class="text-xs text-[var(--text-sec)] truncate flex-1">准备中</span>
                        <div class="w-20 bg-[var(--border)] rounded-full h-1.5"><div id="bar-dl-progress" class="bg-[var(--accent)] h-full rounded-full w-0"></div></div>
                     </div>
                     <button onclick="handleDownloadAll()" id="btn-dl-all" class="btn-primary w-full py-2 text-sm">提取并销毁</button>
                 </div>
              </div>
           </div>

           <div id="modal-text-view" class="hidden fixed inset-0 bg-[var(--bg-body)]/95 backdrop-blur-md z-[200] flex-col p-6">
              <div class="w-full max-w-xl mx-auto flex flex-col h-full">
                 <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold">阅后即焚文本</h3>
                    <button onclick="location.reload()" class="btn-secondary px-3 py-1 text-xs">关闭退出</button>
                 </div>
                 <p class="text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2 rounded mb-3">此文本已同步从服务端抹除，关闭窗口后不可二次查看。</p>
                 <textarea id="area-text-display" readonly class="flex-1 ui-input p-3 font-mono text-xs resize-none"></textarea>
              </div>
           </div>
        </div>`;

        const codeIn = $('input-code');
        codeIn.focus();
        codeIn.addEventListener('input', e => e.target.value = e.target.value.toUpperCase());
        codeIn.addEventListener('keypress', e => { if (e.key === 'Enter') handleFindFiles(); });
        
        const codeParam = new URLSearchParams(window.location.search).get('code');
        if (codeParam && codeParam.length === 4) {
          codeIn.value = codeParam.toUpperCase();
          handleFindFiles();
          window.history.replaceState({}, document.title, "/");
        }
      } else {
        nav.innerText = siteConfig.serverCfg.navAdminUpload || "数据分发中心";
        main.innerHTML = `
        <div class="w-full max-w-3xl flex flex-col gap-5">
           <div class="flex justify-between items-end border-b border-[var(--border)] pb-3">
              <div>
                 <h2 class="text-lg font-bold">${escapeHtml(siteConfig.serverCfg.navAdminUpload || "数据分发中心")}</h2>
                 <p class="text-xs text-[var(--text-sec)] font-mono">容量上限：${formatBytes(siteConfig.serverCfg.maxStorageBytes)}</p>
              </div>
              <div class="flex bg-[var(--border)] p-0.5 rounded-lg">
                 <button onclick="switchAdminTab('upload')" id="tab-btn-upload" class="px-3 py-1 bg-[var(--bg-card)] rounded text-xs font-semibold">数据分发</button>
                 <button onclick="switchAdminTab('manage')" id="tab-btn-manage" class="px-3 py-1 text-[var(--text-sec)] rounded text-xs font-semibold">存储管理</button>
              </div>
           </div>
           
           <div id="panel-admin-upload" class="flex flex-col md:flex-row gap-5">
              <div class="w-full md:w-48 shrink-0 flex flex-col gap-3">
                 <div>
                    <span class="block text-[10px] font-bold text-[var(--text-sec)] uppercase mb-1">模式</span>
                    <div class="flex flex-col gap-1">
                       <label class="ui-card p-2 flex items-center gap-2 cursor-pointer border-[var(--accent)]" id="label-tgt-burn">
                         <input type="radio" name="tgt" value="burn" onchange="setTarget('burn')" checked class="accent-[var(--accent)]">
                         <span class="text-xs font-semibold">阅后即焚</span>
                       </label>
                       <label class="ui-card p-2 flex items-center gap-2 cursor-pointer opacity-60" id="label-tgt-pub">
                         <input type="radio" name="tgt" value="public" onchange="setTarget('public')" class="accent-[var(--accent)]">
                         <span class="text-xs font-semibold">固定直连</span>
                       </label>
                    </div>
                 </div>
                 <div>
                    <span class="block text-[10px] font-bold text-[var(--text-sec)] uppercase mb-1">类型</span>
                    <div class="flex bg-[var(--border)] rounded-lg p-0.5">
                       <button onclick="setMode('file')" id="mode-btn-file" class="flex-1 py-1 bg-[var(--bg-card)] rounded text-xs font-semibold">文件</button>
                       <button onclick="setMode('text')" id="mode-btn-text" class="flex-1 py-1 text-[var(--text-sec)] rounded text-xs font-semibold">文本</button>
                    </div>
                 </div>
                 <button onclick="handleStartUpload()" id="btn-upload" class="btn-primary w-full py-2 text-xs">执行上传</button>
              </div>

              <div class="flex-1 min-h-[200px] relative">
                 <div id="area-upload-file" class="absolute inset-0 flex flex-col">
                    <input type="file" id="file-input" multiple class="hidden" onchange="handleFileSelected(this.files)">
                    <div id="drop-zone" class="border border-dashed border-[var(--border)] bg-[var(--bg-card)] rounded-xl flex-1 flex flex-col items-center justify-center text-[var(--text-sec)] cursor-pointer p-4" onclick="$('file-input').click()">
                       <svg class="w-6 h-6 mb-1 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                       <span class="text-xs">点击选择或拖拽文件至此区域</span>
                    </div>
                    <div id="file-preview-list" class="mt-2 max-h-[80px] overflow-y-auto grid grid-cols-2 gap-1"></div>
                 </div>
                 
                 <div id="area-upload-text" class="hidden absolute inset-0">
                    <textarea id="text-input" class="ui-input w-full h-full p-3 text-xs font-mono" placeholder="粘贴或输入文本内容..."></textarea>
                 </div>
                 
                 <div id="box-up-progress" class="absolute bottom-0 inset-x-0 bg-[var(--bg-card)] border-t border-[var(--border)] p-2 hidden items-center gap-2 rounded-b-xl">
                    <span id="text-up-filename" class="text-xs text-[var(--text-sec)] truncate w-1/3">上传中...</span>
                    <div class="flex-1 bg-[var(--border)] rounded-full h-1.5"><div id="bar-up-progress" class="bg-[var(--accent)] h-full rounded-full w-0"></div></div>
                    <span id="text-up-pct" class="text-xs font-mono font-bold w-8 text-right">0%</span>
                 </div>
              </div>
           </div>

           <div id="panel-admin-manage" class="hidden flex-col gap-3">
              <div class="flex justify-between items-center">
                 <span class="text-xs font-mono text-[var(--text-sec)]" id="text-manage-count">0 个文件</span>
                 <button onclick="fetchAdminFileList()" class="btn-secondary px-2 py-1 text-xs">刷新</button>
              </div>
              <div id="admin-grid-list" class="grid grid-cols-1 md:grid-cols-3 gap-2.5"></div>
           </div>

           <div id="modal-upload-success" class="hidden fixed inset-0 bg-[var(--bg-body)]/95 backdrop-blur-md z-[200] flex-col items-center justify-center p-4">
              <div class="w-full max-w-sm flex flex-col items-center text-center">
                 <h3 class="text-base font-bold mb-1">分发成功</h3>
                 <p id="text-result-hint" class="text-xs text-[var(--text-sec)] mb-3 font-mono"></p>
                 <div id="box-result-card" data-copy="" onclick="copyText(this.dataset.copy)" class="w-full border-2 border-[var(--accent)] bg-[var(--bg-card)] p-3 rounded-xl text-xl font-mono font-extrabold cursor-pointer hover:border-[var(--accent-hover)] mb-4 select-none">---</div>
                 <button onclick="resetAdminForm()" class="btn-secondary w-full py-2 text-xs">继续分发</button>
              </div>
           </div>
        </div>`;

        const zone = $('drop-zone');
        ['dragenter', 'dragover'].forEach(e => zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.add('drop-active'); }));
        ['dragleave', 'drop'].forEach(e => zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.remove('drop-active'); }));
        zone.addEventListener('drop', ev => {
          if (ev.dataTransfer.files.length) handleFileSelected(ev.dataTransfer.files);
        });
      }
    }

    /* 提取逻辑 */
    async function handleFindFiles() {
      const code = $('input-code').value.trim().toUpperCase();
      if (code.length !== 4) return showToast("请输入 4 位有效提取码");

      const btn = $('btn-fetch');
      btn.disabled = true; btn.innerText = "校验中...";

      try {
        const res = await fetch(`${siteConfig.api.find}?code=${code}`);
        if (!res.ok) throw new Error();
        State.downloadList = await res.json();

        const txtItem = State.downloadList.find(i => i.name === siteConfig.serverCfg.textMessageFilename);
        if (txtItem) {
          const preRes = await fetch(`${siteConfig.api.presignGet}?key=${encodeURIComponent(txtItem.key)}`);
          const { url } = await preRes.json();
          const txtRes = await fetch(url);
          $('modal-text-view').classList.replace('hidden', 'flex');
          $('area-text-display').value = await txtRes.text();
          await fetch(`${siteConfig.api.burn}?key=${encodeURIComponent(txtItem.key)}`, { method: 'DELETE' });
        } else {
          $('view-input').classList.add('hidden');
          $('view-result').classList.replace('hidden', 'flex');
          $('text-dl-count').innerText = `${State.downloadList.length} 个文件`;
          $('dl-item-list').innerHTML = State.downloadList.map(f => `
            <div class="p-2.5 flex justify-between items-center text-xs">
               <span class="font-medium truncate pr-2">${escapeHtml(f.name)}</span>
               <span class="font-mono text-[var(--text-sec)] shrink-0">${formatBytes(f.size)}</span>
            </div>
          `).join('');
        }
      } catch (e) { showToast(siteConfig.serverCfg.msgNotFound || "未找到有效数据"); }
      finally { btn.disabled = false; btn.innerText = "提取数据"; }
    }

    async function handleDownloadAll() {
      $('btn-dl-all').disabled = true;
      for (let f of State.downloadList) {
        const box = $('box-dl-progress'), bar = $('bar-dl-progress');
        $('text-dl-filename').innerText = f.name;
        box.classList.replace('hidden', 'flex');

        try {
          const preRes = await fetch(`${siteConfig.api.presignGet}?key=${encodeURIComponent(f.key)}`);
          const { url } = await preRes.json();
          const res = await fetch(url);
          const reader = res.body.getReader();
          const total = +res.headers.get('Content-Length') || 0;
          let loaded = 0, chunks = [];

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value); loaded += value.length;
            if (total > 0) bar.style.width = Math.min(Math.round((loaded / total) * 100), 100) + '%';
          }

          const blobUrl = URL.createObjectURL(new Blob(chunks));
          const a = document.createElement('a');
          a.href = blobUrl; a.download = f.name; a.click();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
          await fetch(`${siteConfig.api.burn}?key=${encodeURIComponent(f.key)}`, { method: 'DELETE' });
        } finally { box.classList.replace('flex', 'hidden'); }
      }
      setTimeout(() => location.reload(), 1000);
    }

    /* 管理后台逻辑 */
    function switchAdminTab(tab) {
      const isUp = tab === 'upload';
      $('panel-admin-upload').classList.toggle('hidden', !isUp);
      $('panel-admin-manage').classList.toggle('hidden', isUp);
      $('tab-btn-upload').className = isUp ? "px-3 py-1 bg-[var(--bg-card)] rounded text-xs font-semibold" : "px-3 py-1 text-[var(--text-sec)] rounded text-xs font-semibold";
      $('tab-btn-manage').className = !isUp ? "px-3 py-1 bg-[var(--bg-card)] rounded text-xs font-semibold" : "px-3 py-1 text-[var(--text-sec)] rounded text-xs font-semibold";
      if (!isUp) fetchAdminFileList();
    }

    function setTarget(tgt) {
      State.uploadTarget = tgt;
      $('label-tgt-burn').className = tgt === 'burn' ? "ui-card p-2 flex items-center gap-2 cursor-pointer border-[var(--accent)]" : "ui-card p-2 flex items-center gap-2 cursor-pointer opacity-60";
      $('label-tgt-pub').className = tgt === 'public' ? "ui-card p-2 flex items-center gap-2 cursor-pointer border-[var(--accent)]" : "ui-card p-2 flex items-center gap-2 cursor-pointer opacity-60";
    }

    function setMode(mode) {
      State.uploadMode = mode;
      $('area-upload-file').classList.toggle('hidden', mode !== 'file');
      $('area-upload-text').classList.toggle('hidden', mode !== 'text');
      $('mode-btn-file').className = mode === 'file' ? "flex-1 py-1 bg-[var(--bg-card)] rounded text-xs font-semibold" : "flex-1 py-1 text-[var(--text-sec)] rounded text-xs font-semibold";
      $('mode-btn-text').className = mode === 'text' ? "flex-1 py-1 bg-[var(--bg-card)] rounded text-xs font-semibold" : "flex-1 py-1 text-[var(--text-sec)] rounded text-xs font-semibold";
    }

    function handleFileSelected(files) {
      State.selectedFiles = [...State.selectedFiles, ...Array.from(files)];
      $('file-preview-list').innerHTML = State.selectedFiles.map((f, i) => `
        <div class="ui-card p-1 px-2 flex justify-between items-center text-xs">
           <span class="truncate pr-1">${escapeHtml(f.name)}</span>
           <button onclick="State.selectedFiles.splice(${i},1); handleFileSelected([])" class="text-[var(--text-sec)] hover:text-red-400">✕</button>
        </div>
      `).join('');
    }

    async function handleStartUpload() {
      const isPublic = State.uploadTarget === 'public';
      let queue = [];

      if (State.uploadMode === 'text') {
        const val = $('text-input').value.trim();
        if (!val) return showToast('请输入文本内容');
        queue = [new File([new Blob([val], { type: 'text/plain;charset=utf-8' })], siteConfig.serverCfg.textMessageFilename)];
      } else {
        if (State.selectedFiles.length === 0) return showToast('请选择文件');
        queue = State.selectedFiles;
      }

      const btn = $('btn-upload'), box = $('box-up-progress'), bar = $('bar-up-progress'), pct = $('text-up-pct'), name = $('text-up-filename');
      State.isUploading = true; btn.disabled = true;
      box.classList.replace('hidden', 'flex');

      try {
        let code = 'N/A';
        if (!isPublic) {
          const cRes = await fetch(siteConfig.api.newCode);
          if (!cRes.ok) throw new Error('提取码生成失败');
          code = (await cRes.json()).code;
        }

        for (let f of queue) {
          name.innerText = f.name;
          const preRes = await fetch(siteConfig.api.presignPut, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: f.name, size: f.size, code, isPublic })
          });
          if (!preRes.ok) throw new Error('申请写入失败');
          const { url, key } = await preRes.json();

          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', url);
            xhr.upload.onprogress = e => {
              if (e.lengthComputable) {
                const p = Math.round((e.loaded / e.total) * 100);
                bar.style.width = p + '%'; pct.innerText = p + '%';
              }
            };
            xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('传输失败'));
            xhr.onerror = () => reject(new Error('网络连接中断'));
            xhr.send(f);
          });

          const card = $('box-result-card');
          $('modal-upload-success').classList.replace('hidden', 'flex');

          if (isPublic) {
            const link = `${window.location.origin}${siteConfig.api.direct}?key=${encodeURIComponent(key)}`;
            card.innerText = "直连链接";
            card.dataset.copy = link;
            $('text-result-hint').innerHTML = `<span class="text-[var(--accent)] break-all">${escapeHtml(link)}</span>`;
          } else {
            card.innerText = code;
            card.dataset.copy = code;
            card.classList.add('letter-spacing-code');
            const link = `${window.location.origin}/?code=${code}`;
            $('text-result-hint').innerHTML = `提取链接：<span class="text-[var(--accent)] font-semibold">${escapeHtml(link)}</span>`;
          }
        }
      } catch (e) { showToast(e.message || '上传失败'); }
      finally {
        State.isUploading = false; btn.disabled = false;
        box.classList.replace('flex', 'hidden'); bar.style.width = '0%';
      }
    }

    async function fetchAdminFileList() {
      const grid = $('admin-grid-list');
      grid.innerHTML = '<div class="col-span-full py-6 text-center text-xs text-[var(--text-sec)] font-mono">加载中...</div>';
      try {
        const res = await fetch(siteConfig.api.adminList);
        const files = await res.json();
        $('text-manage-count').innerText = `${files.length} 个文件`;

        if (files.length === 0) {
          grid.innerHTML = `<div class="col-span-full py-6 text-center text-xs text-[var(--text-sec)]">当前无存储文件</div>`;
          return;
        }

        files.sort((a, b) => new Date(b.uploaded || 0) - new Date(a.uploaded || 0));
        grid.innerHTML = files.map(f => {
          const isPub = f.isPublic || (siteConfig.serverCfg.fixedDownloadPrefix && f.key.startsWith(siteConfig.serverCfg.fixedDownloadPrefix));
          const fname = f.name || f.key.split('/').pop();
          const link = isPub 
            ? `${window.location.origin}${siteConfig.api.direct}?key=${encodeURIComponent(f.key)}`
            : `${window.location.origin}/?code=${f.key.split('/')[0]}`;

          return `
          <div class="ui-card p-3 flex flex-col justify-between gap-2">
             <div class="flex flex-col gap-1">
                <span class="text-[9px] font-bold px-1.5 py-0.5 border rounded w-max ${isPub ? 'border-[var(--border)] text-[var(--text-sec)]' : 'bg-[var(--accent)] text-white border-[var(--accent)]'}">${isPub ? '直连' : '即焚'}</span>
                <span class="text-xs font-bold truncate mt-1" title="${escapeHtml(fname)}">${escapeHtml(fname)}</span>
                <span class="text-[10px] text-[var(--text-sec)] font-mono">${formatBytes(f.size)}</span>
             </div>
             <div class="flex gap-1.5 mt-1">
                <button onclick="copyText('${escapeHtml(link)}')" class="flex-1 text-[11px] font-semibold border border-[var(--border)] py-1 rounded hover:border-[var(--text-main)]">复制链接</button>
                <button onclick="deleteFile('${escapeHtml(f.key)}')" class="text-[11px] font-semibold text-[var(--danger)] border border-red-500/20 py-1 px-2.5 rounded hover:bg-red-500 hover:text-white">销毁</button>
             </div>
          </div>`;
        }).join('');
      } catch (e) { grid.innerHTML = '<div class="col-span-full py-6 text-center text-xs text-red-400">拉取列表失败</div>'; }
    }

    async function deleteFile(key) {
      if (!confirm("确定彻底销毁此文件？")) return;
      try {
        const res = await fetch(`${siteConfig.api.delete}?key=${encodeURIComponent(key)}`, { method: 'DELETE' });
        if (res.ok) { showToast("已彻底销毁"); fetchAdminFileList(); }
      } catch (e) { showToast("删除失败"); }
    }

    function resetAdminForm() {
      State.selectedFiles = [];
      $('file-preview-list').innerHTML = '';
      $('text-input').value = '';
      $('modal-upload-success').classList.replace('flex', 'hidden');
    }

    // 启动 App
    initApp();
  </script>
</body>
</html>
