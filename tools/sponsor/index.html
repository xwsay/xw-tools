<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打赏支持</title>
  <style>
    :root {
      --page-bg: #f2f2f7;
      --card-bg: #ffffff;
      --sub-bg: #f5f5f7;
      --border-color: #e2e2e8;
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --success: #34c759;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #121212;
        --card-bg: #1c1c1e;
        --sub-bg: #2c2c2e;
        --border-color: #38383a;
        --text-main: #f2f2f7;
        --text-sub: #98989d;
        --shadow: 0 10px 30px rgba(0,0,0,0.4);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden !important; 
      background-color: var(--page-bg); 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
      color: var(--text-main); 
      -webkit-font-smoothing: antialiased; 
    }
    
    body { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    .container { 
      width: 100%; 
      max-width: 440px; 
      height: 380px; 
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px; 
      display: flex;
      flex-direction: column;
    }

    .sponsor-wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .sponsor-header { text-align: center; margin-bottom: 18px; }
    .sponsor-main-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
    
    .pay-grid-box { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 14px; 
      height: 280px;
      align-content: start;
    }
    .pay-grid-card { 
      background: var(--sub-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 14px; 
      height: 130px;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      transition: all 0.2s ease;
    }
    .pay-grid-card:hover { 
      background: var(--card-bg);
      border-color: var(--text-sub);
      transform: translateY(-2px);
    }
    .pay-icon { width: 42px; height: 42px; margin-bottom: 10px; }
    .pay-grid-label { font-size: 13px; font-weight: 600; }
    
    .pay-detail-view { display: none; height: 280px; }
    .pay-detail-view.active { display: block; }
    
    .pay-detail-card { 
      position: relative;
      background: var(--sub-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 14px; 
      height: 100%;
      padding: 16px 16px 14px; 
      text-align: center; 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .close-x-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .close-x-btn:hover {
      color: var(--text-main);
      border-color: var(--text-sub);
    }

    .card-pay-title { font-size: 15px; font-weight: 600; margin-top: 2px; }
    
    .qr-img-wrapper { 
      width: 135px; 
      height: 135px; 
      background: #fff; 
      border-radius: 10px; 
      padding: 5px; 
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease;
    }
    .qr-img-wrapper:hover { transform: scale(1.02); }
    .qr-img-wrapper img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
    .pay-subtext { font-size: 12px; color: var(--text-sub); margin-bottom: 2px; }
    
    .crypto-addr-box { 
      width: 100%;
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }
    .crypto-addr-text { 
      flex: 1; 
      font-family: monospace; 
      font-size: 11px; 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 6px; 
      padding: 6px 8px; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      white-space: nowrap; 
      text-align: left; 
    }
    .copy-btn-sm { 
      padding: 6px 12px; 
      font-size: 11px; 
      background: var(--text-main); 
      color: var(--card-bg); 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      transition: all 0.2s ease;
    }
    .copy-btn-sm.copied {
      background: var(--success);
      color: #fff;
    }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s; cursor: zoom-out; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-img { max-width: 80vw; max-height: 70vh; border-radius: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="sponsor-wrapper">
      <div class="sponsor-header">
        <h2 class="sponsor-main-title">感谢您的支持</h2>
      </div>

      <div id="paySelectStep" class="pay-grid-box">
        <div class="pay-grid-card" onclick="App.showPayDetail('wechat')">
          <div class="pay-icon">
            <svg width="100%" height="100%" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="24" fill="#07C160"/><path d="M20.5 14C15.25 14 11 17.58 11 22C11 24.38 12.24 26.51 14.21 27.99L13.5 31L16.8 29.3C17.9 29.75 19.16 30 20.5 30C20.84 30 21.17 29.98 21.5 29.95C21.17 29.04 21 28.04 21 27C21 21.47 25.47 17 31 17C31.84 17 32.67 17.1 33.46 17.3C32.12 15.34 26.63 14 20.5 14ZM17.5 18A1.5 1.5 0 1 1 17.5 21A1.5 1.5 0 0 1 17.5 18ZM23.5 18A1.5 1.5 0 1 1 23.5 21A1.5 1.5 0 0 1 23.5 18Z" fill="white"/><path d="M31 19C26.58 19 23 22.13 23 26C23 29.86 26.58 33 31 33C32.06 33 33.08 32.82 34 32.5L36.5 34L35.9 31.6C37.8 30.3 39 28.3 39 26C39 22.13 35.41 19 31 19ZM28.5 23.5A1 1 0 1 1 28.5 25.5A1 1 0 0 1 28.5 23.5ZM33.5 23.5A1 1 0 1 1 33.5 25.5A1 1 0 0 1 33.5 23.5Z" fill="white"/></svg>
          </div>
          <div class="pay-grid-label">微信</div>
        </div>

        <div class="pay-grid-card" onclick="App.showPayDetail('crypto')">
          <div class="pay-icon">
            <svg width="100%" height="100%" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="24" fill="#26A17B"/><path d="M25.7 26.2V26.19C25.4 26.22 24.7 26.26 24 26.26C23.2 26.26 22.5 26.21 22.3 26.19V26.2C17.9 26 14.6 24.9 14.6 23.6C14.6 22.3 17.9 21.2 22.3 21V23.7C22.5 23.8 23.2 23.9 24 23.9C24.8 23.8 25.5 23.8 25.7 23.7V21C30.1 21.2 33.4 22.3 33.4 23.6C33.4 24.9 30.1 26 25.7 26.2ZM25.7 20.3V18.1H32.5V14H15.5V18.1H22.3V20.3C17.1 20.6 13 21.9 13 23.6C13 25.3 17.1 26.6 22.3 26.9V34H25.7V26.9C30.9 26.6 35 25.3 35 23.6C35 21.9 30.9 20.6 25.7 20.3Z" fill="white"/></svg>
          </div>
          <div class="pay-grid-label">USDT</div>
        </div>
      </div>

      <div id="payDetailStep" class="pay-detail-view">
        <div class="pay-detail-card">
          <button type="button" class="close-x-btn" onclick="App.resetPaySelection()" aria-label="关闭">✕</button>
          
          <div class="card-pay-title" id="cardPayTitle">微信支付</div>
          <div class="qr-img-wrapper">
            <img id="cardQrImg" src="" alt="收款二维码" onclick="App.openModal(this.src)">
          </div>
          <p class="pay-subtext" id="paySubtext">点击二维码放大</p>
          
          <div id="cryptoAddressArea" class="crypto-addr-box" style="display: none;">
            <div class="crypto-addr-text" id="cryptoAddressText"></div>
            <button type="button" class="copy-btn-sm" id="copyBtn" onclick="App.copyAddress()">复制</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="imageModal" class="modal-overlay" onclick="App.closeModal()">
    <img id="modalImg" class="modal-img" src="" alt="放大二维码">
  </div>

  <script>
    // 顶部专属配置区 (变动内容集中在此修改)
    const SITE_CONFIG = {
      wechat: { 
        title: "微信支付", 
        subtext: "点击二维码放大扫描", 
        qrUrl: "https://img.xwsay.com/Piclist/20260813203611045.webp" 
      },
      crypto: { 
        title: "USDT (TRC20)", 
        subtext: "点击放大 / 复制地址", 
        address: "TTuW4MxPkUAEcTWVgwdybPYdjGqci4BzCq", 
        qrUrl: "https://img.xwsay.com/Piclist/20260813201229581.webp" 
      }
    };

    const $ = id => document.getElementById(id);

    const App = {
      showPayDetail(type) {
        const cfg = SITE_CONFIG[type];
        if (!cfg) return;
        $('cardPayTitle').innerText = cfg.title;
        $('cardQrImg').src = cfg.qrUrl;
        $('paySubtext').innerText = cfg.subtext;
        $('cryptoAddressArea').style.display = type === 'crypto' ? 'flex' : 'none';
        if (type === 'crypto') $('cryptoAddressText').innerText = cfg.address;
        
        $('paySelectStep').style.display = 'none';
        $('payDetailStep').classList.add('active');
      },

      resetPaySelection() {
        $('payDetailStep').classList.remove('active');
        $('paySelectStep').style.display = 'grid';
      },

      openModal(src) {
        if (!src) return;
        $('modalImg').src = src;
        $('imageModal').classList.add('active');
      },
      closeModal() {
        $('imageModal').classList.remove('active');
      },

      async copyAddress() {
        const btn = $('copyBtn'), addr = SITE_CONFIG.crypto.address;
        try {
          await navigator.clipboard.writeText(addr);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = addr; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
        }
        btn.innerText = "已复制";
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerText = "复制";
          btn.classList.remove('copied');
        }, 1500);
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.onkeydown = e => { if (e.key === 'Escape') App.closeModal(); };
    });
  </script>
</body>
</html>
