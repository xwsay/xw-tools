        }

            :root {
                --bg-color: #000000;
                --text-primary: #f5f5f7;
                --text-secondary: #86868b;
                --glass-bg: rgba(28, 28, 30, 0.82);
                --glass-border: rgba(255, 255, 255, 0.12);

                --card-hover: #3a3a3c;

            }
            .modal-box { background: #2c2c2e !important; }
            .modal-btn-cancel { background: #3a3a3c !important; color: #f5f5f7 !important; }
            .modal-btn-confirm { background: #0a84ff !important; color: #ffffff !important; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            min-height: 100dvh;
            display: flex; 
            justify-content: center;
            align-items: center; 
            padding: 12px;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .ambient-bg { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;

                        radial-gradient(circle at 80% 80%, var(--glow-2) 0%, transparent 40%); 
            filter: blur(60px); opacity: 0.85; z-index: -1; pointer-events: none; 
        }

        .glass-container { 
            width: 100%; 
            max-width: 420px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            padding: 1rem 0.9rem 0.9rem 0.9rem; 
            box-shadow: var(--shadow-sm);
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
        }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin: 0 0 2px 0; font-size: 1.05rem; font-weight: 600; }

            background: var(--text-primary); color: var(--bg-color);

    <script>
        const $ = id => document.getElementById(id);

        $("page-title").innerText = siteConfig.pageTitle;
        $("brand-link").href = siteConfig.homeUrl;
        $("brand-link").innerText = siteConfig.brandName;
        $("favicon-link").href = siteConfig.faviconUrl;
        $("og-title").content = siteConfig.pageTitle;
        $("og-desc").content = siteConfig.ogDescription;

        $("modal-title").innerText = siteConfig.confirmTitle;
        $("modal-desc").innerText = siteConfig.confirmText;

        const regionSelectEl = $("region-select");
        siteConfig.regions.forEach(item => {
            const opt = document.createElement("option");
            opt.value = item.id;
            opt.innerText = item.name;
            regionSelectEl.appendChild(opt);
        });

        let isAddressGenerated = false;

        const getRandom = arr => arr[Math.floor(Math.random() * arr.length)];

        // 修改点：强制读取 data-copy-val 属性，该属性中仅保存了纯英文内容
        async function copyText(elementId, btnElement) {
            const el = $(elementId);
            const text = el.getAttribute('data-copy-val') || el.innerText; 
            
            const showSuccess = () => {
                const oldText = btnElement.innerText;
                btnElement.innerText = "已复制";
                btnElement.classList.add("copied");
                setTimeout(() => { btnElement.innerText = oldText; btnElement.classList.remove("copied"); }, 1200);
            };

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    fallbackCopy(text);
                }
                showSuccess();
            } catch {
                fallbackCopy(text);
                showSuccess();
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = 'fixed'; 
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);
        }

        // 修改点：新增了 displayHtml 参数，用来渲染带中文的富文本。copyValue 参数只保留纯英文
        const createRow = (label, copyValue, id, displayHtml) => `
            <div class="info-row">
                <div class="info-content">
                    <div class="label">${label}</div>
                    <div class="value" id="${id}" data-copy-val="${copyValue}">${displayHtml || copyValue}</div>
                </div>
                <button class="copy-btn" onclick="copyText('${id}', this)">复制</button>
            </div>`;

        const getRegionConfig = regionId => siteConfig.regions.find(r => r.id === regionId) || siteConfig.regions[0];

        function renderAddress(data) {
            const regionCfg = getRegionConfig(data.regionId);
            
            // 修改点：拼接州/省份的展示文本（英文 + 浅色不参与选中的中文）
            let stateDisplayHtml = data.stateName;
            if (data.stateCnName) {
                stateDisplayHtml = `${data.stateName} <span class="cn-badge">(${data.stateCnName})</span>`;
            }

            $("output").innerHTML = 
                createRow("全名", data.fullName, "val-name") +
                createRow("街道", data.fullStreet, "val-street") +
                createRow("城市", data.cityName, "val-city") +
                createRow(regionCfg.stateLabel, data.stateName, "val-state", stateDisplayHtml) +
                createRow(regionCfg.zipLabel, data.zipCode, "val-zip") +
                createRow("电话", data.phone, "val-phone");
            
            isAddressGenerated = true;
        }

        function handleRegionChange() {
            generateNewAddress();
        }

        function handleGenerateClick() {
            if (isAddressGenerated) {
                $("confirm-modal").classList.add("active");
            } else {
                generateNewAddress();
            }
        }

        function closeModal(e) {
            if (!e || e.target === $("confirm-modal") || e.target.classList.contains("modal-btn-cancel")) {
                $("confirm-modal").classList.remove("active");
            }
        }

        window.addEventListener("keydown", e => {
            if (e.key === "Escape") closeModal();
        });

        function confirmAction() {
            $("confirm-modal").classList.remove("active");
            generateNewAddress();
        }

        function generateNewAddress() {
            const currentRegionId = $("region-select").value;
            const regionCfg = getRegionConfig(currentRegionId);
            
            let addressData;
            let isDuplicate;
            const currentDataStr = localStorage.getItem('xiaowen_multi_address_data');

            do {
                const subObj = getRandom(regionCfg.subdivisions);
                const cityObj = getRandom(subObj.cities);
                
                // 修改点：在生成的随机数据包中，一并带出中文名（如果存在的话）
                addressData = {
                    regionId: currentRegionId,
                    fullName: `${getRandom(regionCfg.firstNames)} ${getRandom(regionCfg.lastNames)}`,
                    fullStreet: `${Math.floor(Math.random() * 9000) + 100} ${getRandom(regionCfg.streetNames)}`,
                    cityName: cityObj.name,
                    stateName: subObj.name,
                    stateCnName: subObj.cnName || "", 
                    zipCode: cityObj.zip,
                    phone: regionCfg.generatePhone()
                };
                
                isDuplicate = currentDataStr === JSON.stringify(addressData);
            } while (isDuplicate);

            try { 
                localStorage.setItem('xiaowen_address_selected_region', currentRegionId);
                localStorage.setItem('xiaowen_multi_address_data', JSON.stringify(addressData)); 
            } catch(e) {}
            
            renderAddress(addressData);
        }
        
        window.addEventListener("DOMContentLoaded", () => {
            try {
                const savedRegion = localStorage.getItem('xiaowen_address_selected_region');
                if (savedRegion) $("region-select").value = savedRegion;

                const savedData = localStorage.getItem('xiaowen_multi_address_data');
                if (savedData) { 
                    const parsed = JSON.parse(savedData);
                    if (parsed && parsed.regionId === $("region-select").value) {
                        renderAddress(parsed);
                        return;
                    }
                } 
                generateNewAddress();
            } catch(e) { 
                generateNewAddress(); 
            }
        });
    </script>
</body>
</html>
