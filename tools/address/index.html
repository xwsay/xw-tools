<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">外区ID地址生成器 | 小闻说</title>
    
    <!-- Open Graph 社交卡片与 Favicon 标签 -->
    <link rel="icon" id="favicon-link" href="" type="image/x-icon">
    <meta property="og:title" id="og-title" content="">
    <meta property="og:description" id="og-desc" content="">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.7);
            --card-bg: #ffffff;
            --card-hover: #f8f8fa;
            --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.06);
            --accent: #0071e3;
            --glow-1: #e0eaff;
            --glow-2: #fce7f3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            min-height: 100dvh; /* 适配移动端动态视口 */
            display: flex; 
            justify-content: center;
            align-items: center; 
            padding: 12px;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* 背景渐变光晕 */
        .ambient-bg { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: radial-gradient(circle at 20% 20%, var(--glow-1) 0%, transparent 40%), 
                        radial-gradient(circle at 80% 80%, var(--glow-2) 0%, transparent 40%); 
            filter: blur(60px); opacity: 0.85; z-index: -1; pointer-events: none; 
        }

        /* 基础玻璃容器（移动端优先的紧凑布局） */
        .glass-container { 
            width: 100%; 
            max-width: 420px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            padding: 1rem 0.9rem 0.9rem 0.9rem; 
            box-shadow: var(--shadow-sm);
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
        }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin: 0 0 2px 0; font-size: 1.05rem; font-weight: 600; }
        .brand-subtitle { text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; }
        .brand-subtitle a { color: var(--text-primary); text-decoration: none; font-weight: 600; }
        .brand-subtitle a:hover { text-decoration: underline; }

        /* 地区切换选择框 */
        select.region-select {
            width: 100%; padding: 8px 10px; font-size: 0.85rem; font-weight: 600;
            background: var(--card-bg); color: var(--text-primary);
            border: 1px solid rgba(0,0,0,0.08); border-radius: 10px;
            margin-bottom: 8px; outline: none; cursor: pointer;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2386868b' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            transition: all 0.2s ease;
        }
        select.region-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12); }

        /* 生成按钮 */
        button.generate-btn { 
            width: 100%; padding: 10px; font-size: 0.9rem; font-weight: 600; 
            background: var(--text-primary); color: #ffffff; 
            border: none; border-radius: 10px; cursor: pointer; margin-bottom: 8px; 
            transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        button.generate-btn:hover { background: #2d2d2f; transform: translateY(-1px); }
        button.generate-btn:active { transform: scale(0.98); opacity: 0.9; }

        /* 信息列表区 */
        .info-list { display: flex; flex-direction: column; gap: 6px; }
        .info-row { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 7px 10px; background: var(--card-bg); 
            border-radius: 10px; border: 1px solid rgba(0,0,0,0.04); 
            transition: background-color 0.2s ease;
        }
        .info-row:hover { background: var(--card-hover); }
        .info-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; padding-right: 8px; }
        .label { font-size: 0.62rem; color: var(--text-secondary); margin-bottom: 1px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .value { font-size: 0.88rem; color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 复制按钮 */
        .copy-btn { 
            padding: 4px 11px; font-size: 0.72rem; font-weight: 600; 
            background: var(--bg-color); color: var(--text-primary);
            border: 1px solid rgba(0,0,0,0.06); border-radius: 99px; 
            cursor: pointer; transition: all 0.15s ease; flex-shrink: 0;
        }
        .copy-btn:hover { background: var(--text-primary); color: #ffffff; border-color: var(--text-primary); }
        .copy-btn:active { transform: scale(0.95); }
        .copy-btn.copied { background: #34c759; border-color: #34c759; color: white; }

        /* 自定义确认模态框 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.18); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: all 0.2s ease; z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: #ffffff; border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 1.1rem; width: 85%; max-width: 290px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            transform: scale(0.92); transition: all 0.2s ease;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 0.92rem; font-weight: 600; margin-bottom: 4px; color: var(--text-primary); }
        .modal-desc { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.35; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-btn {
            flex: 1; padding: 8px; font-size: 0.82rem; font-weight: 600; border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.08); cursor: pointer; transition: all 0.2s;
        }
        .modal-btn-cancel { background: var(--bg-color); color: var(--text-primary); }
        .modal-btn-cancel:hover { background: #e5e5ea; }
        .modal-btn-confirm { background: var(--text-primary); color: #ffffff; border: none; }
        .modal-btn-confirm:hover { background: #2d2d2f; }

        /* ==================== 🖥️ 电脑端大屏（PC）专项适配优化 ==================== */
        @media (min-width: 640px) {
            body { padding: 24px; }
            .glass-container {
                max-width: 450px;
                padding: 1.25rem 1.25rem 1.15rem 1.25rem;
                border-radius: 22px;
            }
            h2 { font-size: 1.2rem; margin-bottom: 3px; }
            .brand-subtitle { font-size: 0.8rem; margin-bottom: 12px; }
            select.region-select { 
                padding: 10px 12px; 
                font-size: 0.88rem; 
                margin-bottom: 10px; 
                border-radius: 12px; 
                background-position: right 10px center;
            }
            button.generate-btn { 
                padding: 11px; 
                font-size: 0.95rem;

                border-radius: 12px; 
            }
            .info-list { gap: 8px; }

            }
            .label { font-size: 0.65rem; margin-bottom: 2px; }
            .value { font-size: 0.95rem; }
            .copy-btn { padding: 5px 14px; font-size: 0.78rem; }
        }
    </style>
</head>

    <div class="ambient-bg"></div>

    <div class="glass-container">
        <h2>🌐 外区ID地址生成器</h2>
        <div class="brand-subtitle"><a href="" id="brand-link" target="_blank">小闻说</a> 专属工具</div>

        <!-- 地区选择下拉框 -->
        <select id="region-select" class="region-select" onchange="handleRegionChange()"></select>

        <button class="generate-btn" onclick="handleGenerateClick()">一键生成新地址</button>
        
        <div id="output" class="info-list"></div>

        <!-- 自定义确认弹窗组件 -->
        <div id="confirm-modal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-title" id="modal-title"></div>
                <div class="modal-desc" id="modal-desc"></div>
                <div class="modal-actions">
                    <button class="modal-btn modal-btn-cancel" id="modal-btn-cancel" onclick="closeModal()">取消</button>
                    <button class="modal-btn modal-btn-confirm" id="modal-btn-confirm" onclick="confirmAction()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化页面基础与 SEO 配置
        document.getElementById("page-title").innerText = siteConfig.pageTitle;
        document.getElementById("brand-link").href = siteConfig.homeUrl;
        document.getElementById("brand-link").innerText = siteConfig.brandName;
        document.getElementById("favicon-link").href = siteConfig.faviconUrl;
        document.getElementById("og-title").content = siteConfig.pageTitle;
        document.getElementById("og-desc").content = siteConfig.ogDescription;

        // 初始化二次确认弹窗文案
        document.getElementById("modal-title").innerText = siteConfig.confirmTitle;
        document.getElementById("modal-desc").innerText = siteConfig.confirmText;
        document.getElementById("modal-btn-cancel").innerText = siteConfig.btnCancelText;
        document.getElementById("modal-btn-confirm").innerText = siteConfig.btnConfirmText;

        // 初始化地区选择下拉框选项
        var regionSelectEl = document.getElementById("region-select");
        siteConfig.regions.forEach(function(item) {
            var opt = document.createElement("option");
            opt.value = item.id;
            opt.innerText = item.name;
            regionSelectEl.appendChild(opt);
        });

        var isAddressGenerated = false;

        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        // 剪贴板复制 API（支持现代 API & 兼容兜底）
        function copyText(elementId, btnElement) {
            var text = document.getElementById(elementId).innerText;
            
            var showSuccess = function() {
                var oldText = btnElement.innerText;
                btnElement.innerText = "已复制";
                btnElement.classList.add("copied");
                setTimeout(function() { btnElement.innerText = oldText; btnElement.classList.remove("copied"); }, 1200);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showSuccess).catch(function() {
                    fallbackCopy(text, showSuccess);
                });
            } else {
                fallbackCopy(text, showSuccess);
            }
        }

        function fallbackCopy(text, callback) {
            var textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = 'fixed'; 
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);
            callback();
        }

        function createRow(label, value, id) {
            return `<div class="info-row">
                <div class="info-content">
                    <div class="label">${label}</div>
                    <div class="value" id="${id}">${value}</div>
                </div>
                <button class="copy-btn" onclick="copyText('${id}', this)">复制</button>
            </div>`;
        }

        function getRegionConfig(regionId) {
            for (var i = 0; i < siteConfig.regions.length; i++) {
                if (siteConfig.regions[i].id === regionId) return siteConfig.regions[i];
            }
            return siteConfig.regions[0];
        }

        function renderAddress(data) {
            var regionCfg = getRegionConfig(data.regionId);
            document.getElementById("output").innerHTML = 
                createRow("全名", data.fullName, "val-name") +
                createRow("街道", data.fullStreet, "val-street") +
                createRow("城市", data.cityName, "val-city") +
                createRow(regionCfg.stateLabel, data.stateName, "val-state") +
                createRow(regionCfg.zipLabel, data.zipCode, "val-zip") +
                createRow("电话", data.phone, "val-phone");
            
            isAddressGenerated = true;
        }

        function handleRegionChange() {
            generateNewAddress();
        }

        function handleGenerateClick() {
            if (isAddressGenerated) {
                document.getElementById("confirm-modal").classList.add("active");
            } else {
                generateNewAddress();
            }
        }

        function closeModal() {
            document.getElementById("confirm-modal").classList.remove("active");
        }

        function confirmAction() {
            closeModal();
            generateNewAddress();
        }

        function generateNewAddress() {
            var currentRegionId = document.getElementById("region-select").value;
            var regionCfg = getRegionConfig(currentRegionId);

            var subObj = getRandom(regionCfg.subdivisions);
            var cityObj = getRandom(subObj.cities);
            
            var addressData = {
                regionId: currentRegionId,
                fullName: getRandom(regionCfg.firstNames) + ' ' + getRandom(regionCfg.lastNames),
                fullStreet: (Math.floor(Math.random() * 9000) + 100) + ' ' + getRandom(regionCfg.streetNames),
                cityName: cityObj.name,
                stateName: subObj.name,
                zipCode: cityObj.zip,
                phone: regionCfg.generatePhone()
            };

            try { 
                localStorage.setItem('xiaowen_address_selected_region', currentRegionId);
                localStorage.setItem('xiaowen_multi_address_data', JSON.stringify(addressData)); 
            } catch(e) {}
            
            renderAddress(addressData);
        }
        
        window.onload = function() {
            try {
                var savedRegion = localStorage.getItem('xiaowen_address_selected_region');
                if (savedRegion) { document.getElementById("region-select").value = savedRegion; }

                var savedData = localStorage.getItem('xiaowen_multi_address_data');
                if (savedData) { 
                    var parsed = JSON.parse(savedData);
                    if (parsed && parsed.regionId === document.getElementById("region-select").value) {
                        renderAddress(parsed);
                        return;
                    }
                } 
                generateNewAddress();
            } catch(e) { generateNewAddress(); }
        };
    </script>
</body>
</html>
