            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            width: 85%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transform: scale(0.92);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .modal-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        .modal-btn {
            flex: 1;
            padding: 9px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn-cancel {
            background: #f5f5f7;
            color: var(--text-primary);
        }

        .modal-btn-cancel:hover {
            background: #e5e5ea;
        }

        .modal-btn-confirm {
            background: var(--text-primary);
            color: #ffffff;
            border: none;
        }

        .modal-btn-confirm:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="ambient-bg"></div>

<div class="glass-container" id="main-card">
    <h2>🌐 外区ID地址生成器</h2>

    <div class="brand-subtitle">
        <a href="" id="brand-link" target="_blank">小闻说</a>
        专属工具
    </div>

    <select id="region-select" class="region-select" onchange="handleRegionChange()"></select>

    <button class="generate-btn" onclick="handleGenerateClick()">
        一键生成新地址
    </button>

    <div id="output" class="info-list"></div>

    <div id="confirm-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-desc" id="modal-desc"></div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="btn-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" id="btn-confirm" onclick="confirmAction()">确定</button>
            </div>
        </div>
    </div>
</div>

<script>
// 识别是否在 Notion 博客嵌入框中，自动去除多余容器边框与阴影
if (window.self !== window.top) {
    document.body.classList.add("embedded");
}

const $ = id => document.getElementById(id);
const STORAGE_KEY = "xwsay_saved_address_v2";

$("page-title").innerText = siteConfig.pageTitle;
$("brand-link").href = siteConfig.homeUrl;
$("brand-link").innerText = siteConfig.brandName;
$("favicon-link").href = siteConfig.faviconUrl;
$("og-title").content = siteConfig.pageTitle;
$("og-desc").content = siteConfig.ogDescription;
$("modal-title").innerText = siteConfig.confirmTitle;
$("modal-desc").innerText = siteConfig.confirmText;
$("btn-cancel").innerText = siteConfig.btnCancelText;
$("btn-confirm").innerText = siteConfig.btnConfirmText;

const regionSelectEl = $("region-select");
siteConfig.regions.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.innerText = item.name;
    regionSelectEl.appendChild(opt);
});

let isAddressGenerated = false;

const getRandom = arr => arr[Math.floor(Math.random() * arr.length)];

async function copyRawText(text, btnElement) {
    const showSuccess = () => {
        const oldText = btnElement.getAttribute("data-orig-text") || btnElement.innerText;
        btnElement.setAttribute("data-orig-text", oldText);
        btnElement.innerText = "已复制";
        btnElement.classList.add("copied");

        setTimeout(() => {
            btnElement.innerText = oldText;
            btnElement.classList.remove("copied");
        }, 1200);
    };

    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
        } else {
            fallbackCopy(text);
        }
        showSuccess();
    } catch {
        fallbackCopy(text);
        showSuccess();
    }
}

function fallbackCopy(text) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);
}

const createRow = (label, copyValue, id, displayHtml) => `
    <div class="info-row">
        <div class="info-content">
            <div class="label">${label}</div>
            <div class="value" id="${id}" data-copy-val="${copyValue}" title="${copyValue}">
                ${displayHtml || copyValue}
            </div>
        </div>
        <button class="copy-btn" onclick="copyRawText('${copyValue.replace(/'/g, "\\'")}', this)">复制</button>
    </div>
`;

const createNameRow = (firstName, lastName) => {
    const fullName = `${firstName} ${lastName}`;
    return `
    <div class="info-row">
        <div class="info-content">
            <div class="label">全名 (名 First · 姓 Last)</div>
            <div class="value" id="val-name" title="${fullName}">
                ${fullName}
            </div>
        </div>
        <div class="btn-group">
            <button class="copy-btn" onclick="copyRawText('${firstName}', this)">复制名</button>
            <button class="copy-btn" onclick="copyRawText('${lastName}', this)">复制姓</button>
        </div>
    </div>
    `;
};

const getRegionConfig = regionId =>
    siteConfig.regions.find(r => r.id === regionId) || siteConfig.regions[0];

function renderAddress(data) {
    const regionCfg = getRegionConfig(data.regionId);

    let stateDisplayHtml = data.stateName;
    if (data.stateCnName) {
        stateDisplayHtml = `${data.stateName} <span class="cn-badge">(${data.stateCnName})</span>`;
    }

    $("output").innerHTML =
        createNameRow(data.firstName, data.lastName) +
        createRow("街道", data.fullStreet, "val-street") +
        createRow("城市", data.cityName, "val-city") +
        createRow(regionCfg.stateLabel, data.stateName, "val-state", stateDisplayHtml) +
        createRow(regionCfg.zipLabel, data.zipCode, "val-zip") +
        createRow("电话 (点击仅复制纯数字)", data.phoneCopy, "val-phone", data.phoneDisplay);

    isAddressGenerated = true;
}

function handleRegionChange() {
    generateNewAddress();
}

function handleGenerateClick() {
    if (isAddressGenerated) {
        $("confirm-modal").classList.add("active");
    } else {
        generateNewAddress();
    }
}

function closeModal(e) {
    if (!e || e.target === $("confirm-modal") || e.target.classList.contains("modal-btn-cancel")) {
        $("confirm-modal").classList.remove("active");
    }
}

window.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
});

function confirmAction() {
    $("confirm-modal").classList.remove("active");
    generateNewAddress();
}

function generateNANPPhone(cityObj, defaultAreaCode = "202") {
    const areaCode = getRandom(cityObj.areaCodes || [defaultAreaCode]);
    const prefix = Math.floor(Math.random() * 800) + 200;
    const line = Math.floor(Math.random() * 9000) + 1000;
    return {
        display: `+1-${areaCode}-${prefix}-${line}`,
        copy: `${areaCode}${prefix}${line}`
    };
}

function generateNewAddress() {
    const currentRegionId = $("region-select").value;
    const regionCfg = getRegionConfig(currentRegionId);

    const subObj = getRandom(regionCfg.subdivisions);
    const cityObj = getRandom(subObj.cities);
    const streetBase = getRandom(cityObj.streets);

    let fullStreet = "";
    if (currentRegionId === "JP") {
        const chome = Math.floor(Math.random() * 4) + 1;
        const ban = Math.floor(Math.random() * 25) + 1;
        const go = Math.floor(Math.random() * 15) + 1;
        fullStreet = `${streetBase} ${chome}-${ban}-${go}`;
    } else if (currentRegionId === "UK" || currentRegionId === "HK" || currentRegionId === "SG") {
        const streetNumber = Math.floor(Math.random() * 350) + 1;
        fullStreet = `${streetNumber} ${streetBase}`;
    } else {
        const streetNumber = Math.floor(Math.random() * 9900) + 100;
        fullStreet = `${streetNumber} ${streetBase}`;
    }

    const firstName = getRandom(regionCfg.firstNames);
    const lastName = getRandom(regionCfg.lastNames);

    let phoneObj;
    if (currentRegionId === "US" || currentRegionId === "CA") {
        phoneObj = generateNANPPhone(cityObj, currentRegionId === "US" ? "302" : "416");
    } else {
        phoneObj = regionCfg.generatePhone();
    }

    const addressData = {
        regionId: currentRegionId,
        firstName: firstName,
        lastName: lastName,
        fullStreet: fullStreet,
        cityName: cityObj.name,
        stateName: subObj.name,
        stateCnName: subObj.cnName || "",
        zipCode: cityObj.zip,
        phoneDisplay: phoneObj.display,
        phoneCopy: phoneObj.copy
    };

    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(addressData));
    } catch (e) {}

    renderAddress(addressData);
}

window.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const urlRegion = (urlParams.get("region") || "").toUpperCase();
    const hasValidUrlRegion = siteConfig.regions.some(r => r.id === urlRegion);

    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.regionId && parsed.firstName) {
                if (!hasValidUrlRegion || parsed.regionId === urlRegion) {
                    regionSelectEl.value = parsed.regionId;
                    renderAddress(parsed);
                    return;
                }
            }
        }
    } catch (e) {}

    if (hasValidUrlRegion) {
        regionSelectEl.value = urlRegion;
    }
    generateNewAddress();
});
</script>

</body>
</html>
