<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>反馈与打赏</title>
  <style>
    :root {
      --bg: #ffffff; --bg-sub: #f5f5f7; --bg-hover: #ebebea;
      --border: #e5e5ea; --text: #1d1d1f; --text-sub: #86868b;
      --danger: #ff3b30; --success: #34c759; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    /* 严格锁定屏幕，不出现任何滚动条 */
    html, body { 
      width: 100%; 
      height: 100vh; 
      overflow: hidden; 
      background: var(--bg); 
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
      color: var(--text); 
      line-height: 1.4; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      -webkit-font-smoothing: antialiased; 
    }
    
    /* 容器整体紧凑居中，高度锁定 */
    .container { 
      width: 100%; 
      max-width: 400px; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      box-sizing: border-box;
    }
    
    /* Nav & Tabs */
    .header-nav { 
      display: flex; 
      gap: 20px; 
      margin-bottom: 14px; 
      border-bottom: 1px solid #f0f0f2; 
      padding-bottom: 8px; 
    }
    .header-title { 
      font-size: 16px; 
      font-weight: 600; 
      color: #c7c7cc; 
      cursor: pointer; 
      background: none; 
      border: none; 
      position: relative; 
      transition: color 0.2s; 
    }
    .header-title.active { color: var(--text); }
    .header-title.active::after { 
      content: ''; 
      position: absolute; 
      bottom: -9px; 
      left: 0; 
      right: 0; 
      height: 2px; 
      background: var(--text); 
      border-radius: 2px 2px 0 0; 
    }
    
    .tab-content, .pay-detail-view { display: none; animation: fadeIn 0.25s ease; }
    .tab-content.active, .pay-detail-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Form Components */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--text-sub); margin-bottom: 4px; }
    input, textarea { 
      width: 100%; 
      padding: 10px 12px; 
      background: var(--bg-sub); 
      border: 1px solid transparent; 
      border-radius: var(--radius); 
      font-size: 14px; 
      color: var(--text); 
      outline: none; 
      transition: all 0.2s; 
      font-family: inherit; 
    }
    input:focus, textarea:focus { background: var(--bg); border-color: var(--text); box-shadow: 0 0 0 3px rgba(0,0,0,0.04); }
    
    /* 问题描述框固定为适中的精简高度 */
    textarea { 
      height: 80px; 
      resize: none; 
    }
    
    .file-area { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: var(--bg-sub); 
      padding: 8px 12px; 
      border-radius: var(--radius); 
      margin-bottom: 12px; 
      font-size: 12px; 
    }
    .link-btn { color: var(--text); cursor: pointer; font-weight: 500; background: none; border: none; }
    #removeBtn { color: var(--danger); display: none; }
    
    #preview { 
      width: 100%; 
      max-height: 60px; 
      object-fit: contain; 
      border-radius: var(--radius); 
      display: none; 
      margin-bottom: 12px; 
      border: 1px solid var(--border); 
    }
    
    .btn { 
      width: 100%; 
      padding: 12px; 
      background: #1c1c1e; 
      color: #fff; 
      border: none; 
      border-radius: var(--radius); 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 8px; text-align: center; font-size: 12px; font-weight: 500; min-height: 16px; }

    /* Sponsor Module */
    .sponsor-header { text-align: center; margin-bottom: 14px; }
    .sponsor-main-title { font-size: 18px; font-weight: 700; }
    .pay-grid-box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .pay-grid-card { 
      background: var(--bg-sub); 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      padding: 16px 8px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .pay-grid-card:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    .pay-icon { width: 36px; height: 36px; margin-bottom: 6px; }
    .pay-grid-label { font-size: 13px; font-weight: 600; }
    
    .pay-detail-card { 
      background: #fff; 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      padding: 14px 12px; 
      text-align: center; 
      box-shadow: 0 6px 18px rgba(0,0,0,0.05); 
    }
    .card-pay-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .qr-img-wrapper { width: 120px; height: 120px; margin: 0 auto 8px; background: var(--bg-sub); border-radius: 10px; padding: 6px; }
    .qr-img-wrapper img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; cursor: zoom-in; }
    .pay-subtext { font-size: 11px; color: var(--text-sub); }
    .crypto-addr-box { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); display: flex; align-items: center; gap: 6px; }
    .crypto-addr-text { flex: 1; font-family: monospace; font-size: 11px; background: var(--bg-sub); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .copy-btn-sm { padding: 6px 10px; font-size: 11px; background: var(--text); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; flex-shrink: 0; }
    .btn-secondary { width: 100%; margin-top: 10px; padding: 8px 0; background: var(--bg-sub); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.25s; cursor: zoom-out; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-img { max-width: 85vw; max-height: 80vh; border-radius: 16px; transform: scale(0.95); transition: transform 0.25s; }
    .modal-overlay.active .modal-img { transform: scale(1); }
  </style>
</head>
<body>

  <div class="container">
    <!-- 头部 Tab 导航 -->
    <div class="header-nav">
      <button class="header-title active" id="titleFeedback" onclick="switchTab('feedback')">留言反馈</button>
      <button class="header-title" id="titleSponsor" onclick="switchTab('sponsor')">打赏支持</button>
    </div>

    <!-- 1. 留言反馈区域 -->
    <div id="tabFeedback" class="tab-content active">
      <form id="feedbackForm" novalidate>
        <div class="form-group">
          <label for="email">您的邮箱 (必填)</label>
          <input type="email" id="email" placeholder="例如QQ邮箱" required>
        </div>
        <div class="form-group">
          <label for="message">问题描述 (必填)</label>
          <textarea id="message" placeholder="请详细描述您遇到的问题或建议..." required></textarea>
        </div>
        <div class="file-area">
          <input type="file" id="imageFile" accept="image/*" style="display:none">
          <button type="button" class="link-btn" onclick="$('imageFile').click()">添加图片 (小于10MB)</button>
          <button type="button" class="link-btn" id="removeBtn">删除</button>
        </div>
        <img id="preview" alt="图片预览">
        <button type="submit" class="btn" id="submitBtn">提 交</button>
      </form>
      <div id="status"></div>
    </div>

    <!-- 2. 打赏支持区域 -->
    <div id="tabSponsor" class="tab-content">
      <div class="sponsor-header">
        <h2 class="sponsor-main-title">感谢您的支持</h2>
      </div>

      <!-- 选择网格 -->
      <div id="paySelectStep" class="pay-grid-box">
        <div class="pay-grid-card" onclick="showPayDetail('wechat')">
          <div class="pay-icon">
            <svg width="36" height="36" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="24" fill="#07C160"/><path d="M20.5 14C15.25 14 11 17.58 11 22C11 24.38 12.24 26.51 14.21 27.99L13.5 31L16.8 29.3C17.9 29.75 19.16 30 20.5 30C20.84 30 21.17 29.98 21.5 29.95C21.17 29.04 21 28.04 21 27C21 21.47 25.47 17 31 17C31.84 17 32.67 17.1 33.46 17.3C32.12 15.34 26.63 14 20.5 14ZM17.5 18A1.5 1.5 0 1 1 17.5 21A1.5 1.5 0 0 1 17.5 18ZM23.5 18A1.5 1.5 0 1 1 23.5 21A1.5 1.5 0 0 1 23.5 18Z" fill="white"/><path d="M31 19C26.58 19 23 22.13 23 26C23 29.86 26.58 33 31 33C32.06 33 33.08 32.82 34 32.5L36.5 34L35.9 31.6C37.8 30.3 39 28.3 39 26C39 22.13 35.41 19 31 19ZM28.5 23.5A1 1 0 1 1 28.5 25.5A1 1 0 0 1 28.5 23.5ZM33.5 23.5A1 1 0 1 1 33.5 25.5A1 1 0 0 1 33.5 23.5Z" fill="white"/></svg>
          </div>
          <div class="pay-grid-label">微信支付</div>
        </div>

        <div class="pay-grid-card" onclick="showPayDetail('crypto')">
          <div class="pay-icon">
            <svg width="36" height="36" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="24" fill="#26A17B"/><path d="M25.7 26.2V26.19C25.4 26.22 24.7 26.26 24 26.26C23.2 26.26 22.5 26.21 22.3 26.19V26.2C17.9 26 14.6 24.9 14.6 23.6C14.6 22.3 17.9 21.2 22.3 21V23.7C22.5 23.8 23.2 23.9 24 23.9C24.8 23.9 25.5 23.8 25.7 23.7V21C30.1 21.2 33.4 22.3 33.4 23.6C33.4 24.9 30.1 26 25.7 26.2ZM25.7 20.3V18.1H32.5V14H15.5V18.1H22.3V20.3C17.1 20.6 13 21.9 13 23.6C13 25.3 17.1 26.6 22.3 26.9V34H25.7V26.9C30.9 26.6 35 25.3 35 23.6C35 21.9 30.9 20.6 25.7 20.3Z" fill="white"/></svg>
          </div>
          <div class="pay-grid-label">USDT</div>
        </div>
      </div>

      <!-- 详细展示卡片 -->
      <div id="payDetailStep" class="pay-detail-view">
        <div class="pay-detail-card">
          <div class="card-pay-title" id="cardPayTitle">微信支付</div>
          <div class="qr-img-wrapper">
            <img id="cardQrImg" src="" alt="收款二维码" onclick="openModal(this.src)">
          </div>
          <p class="pay-subtext" id="paySubtext">打开微信扫描二维码</p>
          
          <div id="cryptoAddressArea" class="crypto-addr-box" style="display: none;">
            <div class="crypto-addr-text" id="cryptoAddressText"></div>
            <button type="button" class="copy-btn-sm" id="copyBtn" onclick="copyAddress()">复制</button>
          </div>

          <button type="button" class="btn-secondary" onclick="resetPaySelection()">返回选择</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 二维码放大 Modal -->
  <div id="imageModal" class="modal-overlay" onclick="closeModal()">
    <img id="modalImg" class="modal-img" src="" alt="放大二维码">
  </div>

  <script>
    const $ = id => document.getElementById(id);
    
    // ==================== 顶部专属配置区 ====================
    const siteConfig = {
      wechat: { title: "微信支付", subtext: "扫码或保存图片支付", qrUrl: "https://img.xwsay.com/Piclist/20260813203611045.webp" },
      crypto: { title: "USDT (TRC20)", subtext: "扫描二维码或复制下方地址", address: "TTuW4MxPkUAEcTWVgwdybPYdjGqci4BzCq", qrUrl: "https://img.xwsay.com/Piclist/20260813201229581.webp" }
    };
    // =======================================================

    function switchTab(type) {
      const isFb = type === 'feedback';
      $('titleFeedback').classList.toggle('active', isFb);
      $('titleSponsor').classList.toggle('active', !isFb);
      $('tabFeedback').classList.toggle('active', isFb);
      $('tabSponsor').classList.toggle('active', !isFb);
      if (!isFb) resetPaySelection();
    }

    function showPayDetail(type) {
      const cfg = siteConfig[type];
      if (!cfg) return;
      $('cardPayTitle').innerText = cfg.title;
      $('cardQrImg').src = cfg.qrUrl;
      $('paySubtext').innerText = cfg.subtext;
      $('cryptoAddressArea').style.display = type === 'crypto' ? 'flex' : 'none';
      if (type === 'crypto') $('cryptoAddressText').innerText = cfg.address;
      $('paySelectStep').style.display = 'none';
      $('payDetailStep').classList.add('active');
    }

    function resetPaySelection() {
      $('payDetailStep').classList.remove('active');
      $('paySelectStep').style.display = 'grid';
    }

    function openModal(src) {
      if (!src) return;
      $('modalImg').src = src;
      $('imageModal').classList.add('active');
    }

    function closeModal() {
      $('imageModal').classList.remove('active');
    }

    window.onkeydown = e => { if (e.key === 'Escape') closeModal(); };

    async function copyAddress() {
      const btn = $('copyBtn'), addr = siteConfig.crypto.address;
      try {
        await navigator.clipboard.writeText(addr);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = addr; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      btn.innerText = "已复制";
      setTimeout(() => btn.innerText = "复制", 1500);
    }

    function clearPreview() {
      if ($('preview').src.startsWith('blob:')) URL.revokeObjectURL($('preview').src);
      $('preview').src = '';
      $('preview').style.display = $('removeBtn').style.display = 'none';
    }

    $('imageFile').onchange = e => {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 10 * 1024 * 1024) {
          alert("图片大小不能超过 10MB，请压缩后再试");
          e.target.value = ''; clearPreview(); return;
        }
        clearPreview();
        $('preview').src = URL.createObjectURL(file);
        $('preview').style.display = 'block';
        $('removeBtn').style.display = 'inline-block';
      }
    };

    $('removeBtn').onclick = () => { $('imageFile').value = ''; clearPreview(); };

    $('feedbackForm').onsubmit = async e => {
      e.preventDefault();
      const email = $('email').value.trim(), message = $('message').value.trim();
      const statusDiv = $('status'), submitBtn = $('submitBtn');

      if (!email || !message) {
        statusDiv.innerText = "请填写完必填项后再提交";
        statusDiv.style.color = "var(--danger)";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "发送中...";
      statusDiv.innerText = "";

      const formData = new FormData();
      formData.append('email', email);
      formData.append('message', message);
      if ($('imageFile').files[0]) formData.append('image', $('imageFile').files[0]);

      try {
        const res = await fetch('{{WORKER_URL}}api/submit', { method: 'POST', body: formData });
        const data = await res.json().catch(() => ({}));

        if (res.ok && data.ok) {
          statusDiv.innerText = "提交成功，感谢您的反馈！";
          statusDiv.style.color = "var(--success)";
          e.target.reset(); clearPreview();
          setTimeout(() => statusDiv.innerText = "", 4000);
        } else throw new Error(data.error || "提交失败");
      } catch (err) {
        statusDiv.innerText = err.message || "网络错误，请稍后重试";
        statusDiv.style.color = "var(--danger)";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "提 交";
      }
    };
  </script>
</body>
</html>
