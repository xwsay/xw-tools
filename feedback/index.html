<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>反馈与赞赏</title>
  <style>
    :root { --theme: #000000; } /* 💡 主题色 */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; color: #1d1d1f; padding: 24px; -webkit-font-smoothing: antialiased; }
    
    /* 标题切换样式 */
    .header-nav { display: flex; gap: 20px; margin-bottom: 24px; border-bottom: 1px solid #f0f0f2; padding-bottom: 12px; }
    .header-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; color: #c7c7cc; cursor: pointer; transition: color 0.2s ease; user-select: none; }
    .header-title.active { color: #1d1d1f; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 表单组件 */
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #86868b; margin-bottom: 8px; }
    input, textarea { width: 100%; padding: 14px 16px; background: #f5f5f7; border: 2px solid transparent; border-radius: 12px; font-size: 15px; color: #1d1d1f; outline: none; transition: all 0.25s ease; font-family: inherit; }
    input:focus, textarea:focus { background: #ffffff; border-color: var(--theme); box-shadow: 0 0 0 4px rgba(0,0,0,0.05); }
    textarea { height: 120px; resize: none; line-height: 1.5; }
    
    .file-area { display: flex; align-items: center; justify-content: space-between; background: #f5f5f7; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; }
    .link-btn { color: var(--theme); cursor: pointer; font-weight: 500; display: flex; align-items: center; }
    #removeBtn { color: #ff3b30; }
    #preview { width: 100%; max-height: 160px; object-fit: cover; border-radius: 12px; display: none; margin-bottom: 20px; border: 1px solid #e5e5ea; }
    
    .btn { width: 100%; padding: 16px; background: var(--theme); color: #ffffff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s ease, opacity 0.2s ease; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #status { margin-top: 16px; text-align: center; font-size: 14px; font-weight: 500; min-height: 20px; }

    /* 赞赏组件 */
    .sponsor-tip { font-size: 14px; color: #86868b; margin-bottom: 20px; line-height: 1.4; }
    .qr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .qr-card { background: #f5f5f7; border-radius: 12px; padding: 16px; text-align: center; }
    .qr-card img { width: 100%; max-width: 130px; border-radius: 8px; margin-bottom: 8px; }
    .qr-card p { font-size: 13px; font-weight: 500; color: #86868b; }
    .crypto-addr { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

  <!-- 头部大标题选项卡 -->
  <div class="header-nav">
    <div class="header-title active" id="titleFeedback" onclick="switchTab('feedback')">留言反馈</div>
    <div class="header-title" id="titleSponsor" onclick="switchTab('sponsor')">赞赏支持</div>
  </div>

  <!-- 1. 留言反馈区域 -->
  <div id="tabFeedback" class="tab-content active">
    <form id="feedbackForm">
      <div class="form-group">
        <label>您的邮箱 (必填)</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label>问题描述 (必填)</label>
        <textarea id="message" placeholder="请详细描述您遇到的问题或建议..." required></textarea>
      </div>
      <div class="file-area">
        <input type="file" id="imageFile" accept="image/*" style="display:none">
        <span class="link-btn" onclick="document.getElementById('imageFile').click()">📎 添加图片 (小于10MB)</span>
        <span class="link-btn" id="removeBtn" style="display:none;">删除</span>
      </div>
      <img id="preview" alt="图片预览">
      <button type="submit" class="btn" id="submitBtn">提 交</button>
    </form>
    <div id="status"></div>
  </div>

  <!-- 2. 赞赏支持区域 -->
  <div id="tabSponsor" class="tab-content">
    <p class="sponsor-tip" id="sponsorTip"></p>
    
    <div class="qr-grid" id="qrContainer"></div>

    <div class="form-group" id="cryptoGroup" style="display:none;">
      <label id="cryptoLabel">USDT (TRC20) 转账地址</label>
      <input type="text" class="crypto-addr" id="cryptoAddrInput" readonly>
    </div>
    <button class="btn" id="copyBtn" style="display:none;" onclick="copyAddress()">复 制 地 址</button>
  </div>

  <script>
    /* ===================================================================
     * 💡 配置区
     * =================================================================== */
    const siteConfig = {
      sponsorTip: "感谢您的支持，所有赞赏资金将用于服务器运维。",
      paymentQRs: [
        { name: "微信支付", url: "https://xwsay.com/wechat-pay.jpg" },
        { name: "支付宝", url: "https://xwsay.com/alipay.jpg" }
      ],
      crypto: {
        label: "USDT (TRC20) 转账地址",
        address: "你的USDT收款地址"
      }
    };

    /* ===================================================================
     * Tab 切换与赞赏逻辑
     * =================================================================== */
    function switchTab(type) {
      const titleFeedback = document.getElementById('titleFeedback');
      const titleSponsor = document.getElementById('titleSponsor');
      const tabFeedback = document.getElementById('tabFeedback');
      const tabSponsor = document.getElementById('tabSponsor');

      if (type === 'feedback') {
        titleFeedback.classList.add('active');
        titleSponsor.classList.remove('active');
        tabFeedback.classList.add('active');
        tabSponsor.classList.remove('active');
      } else {
        titleSponsor.classList.add('active');
        titleFeedback.classList.remove('active');
        tabSponsor.classList.add('active');
        tabFeedback.classList.remove('active');
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("sponsorTip").innerText = siteConfig.sponsorTip;

      // 渲染二维码
      const qrContainer = document.getElementById("qrContainer");
      if (siteConfig.paymentQRs && siteConfig.paymentQRs.length > 0) {
        qrContainer.innerHTML = siteConfig.paymentQRs.map(qr => `
          <div class="qr-card">
            <img src="${qr.url}" alt="${qr.name}" onerror="this.onerror=null; this.style.display='none';">
            <p>${qr.name}</p>
          </div>
        `).join('');
      } else {
        qrContainer.style.display = "none";
      }

      // 渲染 Crypto 地址
      if (siteConfig.crypto && siteConfig.crypto.address) {
        document.getElementById("cryptoGroup").style.display = "block";
        document.getElementById("copyBtn").style.display = "block";
        document.getElementById("cryptoLabel").innerText = siteConfig.crypto.label;
        document.getElementById("cryptoAddrInput").value = siteConfig.crypto.address;
      }
    });

    // 复制地址逻辑
    function copyAddress() {
      const addr = document.getElementById("cryptoAddrInput").value;
      const copyBtn = document.getElementById("copyBtn");

      navigator.clipboard.writeText(addr).then(() => {
        copyBtn.innerText = "✅ 地址已复制";
        setTimeout(() => { copyBtn.innerText = "复 制 地 址"; }, 1500);
      }).catch(() => {
        alert("复制失败，请手动复制");
      });
    }

    /* ===================================================================
     * 留言提交与图片上传逻辑
     * =================================================================== */
    const form = document.getElementById('feedbackForm');
    const fileInput = document.getElementById('imageFile');
    const preview = document.getElementById('preview');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const removeBtn = document.getElementById('removeBtn');

    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        // Telegram sendPhoto 接口上限 10MB
        if (file.size > 10 * 1024 * 1024) {
          alert("图片大小不能超过 10MB，请压缩后再试");
          fileInput.value = ''; 
          return;
        }
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        removeBtn.style.display = 'block';
      }
    };

    removeBtn.onclick = () => {
      fileInput.value = ''; 
      preview.src = '';
      preview.style.display = 'none'; 
      removeBtn.style.display = 'none';
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = "发送中...";
      statusDiv.innerText = "";
      
      const formData = new FormData();
      formData.append('email', document.getElementById('email').value.trim());
      formData.append('message', document.getElementById('message').value.trim());
      if (fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      try {
        const response = await fetch('{{WORKER_URL}}api/submit', { 
          method: 'POST', 
          body: formData 
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok && data.ok) {
          statusDiv.innerText = "✅ 提交成功，感谢您的反馈！";
          statusDiv.style.color = "#34c759";
          form.reset(); 
          preview.style.display = 'none'; 
          removeBtn.style.display = 'none';
          setTimeout(() => { statusDiv.innerText = ""; }, 4000);
        } else {
          throw new Error(data.error || "提交失败");
        }
      } catch (err) {
        statusDiv.innerText = `❌ ${err.message || "网络错误，请稍后重试"}`;
        statusDiv.style.color = "#ff3b30";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "提 交";
      }
    };
  </script>
</body>
</html>
